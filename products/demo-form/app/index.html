<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Demo Registration Form</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px; margin: 40px auto; }
    label { display: block; margin-top: 12px; }
    input, select { width: 100%; padding: 6px; box-sizing: border-box; }
    .error { color: #b00020; font-size: 0.9em; }
    #success { color: #0a7a2f; margin-top: 16px; }
    button { margin-top: 16px; padding: 8px 16px; }
  </style>
</head>
<body>
  <h1>Registration</h1>
  <form id="registration-form" novalidate>
    <label for="fullName">Your name</label>
    <input id="fullName" name="fullName" type="text" />
    <div class="error" id="fullName-error" role="alert"></div>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" />
    <div class="error" id="email-feedback" role="alert"></div>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" />
    <div class="error" id="password-error" role="alert"></div>

    <label for="country">Country</label>
    <select id="country" name="country">
      <option value="">-- Select --</option>
      <option value="de">Germany</option>
      <option value="in">India</option>
      <option value="us">United States</option>
    </select>

    <label><input id="terms" name="terms" type="checkbox" style="width:auto" /> I accept the terms</label>
    <div class="error" id="terms-error" role="alert"></div>

    <button type="submit">Create account</button>
    <button type="reset">Reset</button>
  </form>
  <p id="success" role="status"></p>

  <script>
    const form = document.getElementById("registration-form");
    const success = document.getElementById("success");
    const setError = (id, msg) =>
      (document.getElementById(id + (id === "email" ? "-feedback" : "-error")).textContent = msg);

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      success.textContent = "";
      const name = form.fullName.value.trim();
      const email = form.email.value.trim();
      const password = form.password.value;
      let valid = true;

      setError("fullName", name ? "" : "Full name is required");
      setError("email", /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? "" : "Enter a valid email");
      setError("password", password.length >= 8 ? "" : "Password must be at least 8 characters");
      setError("terms", form.terms.checked ? "" : "You must accept the terms");
      valid = name && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) && password.length >= 8 && form.terms.checked;

      if (valid) success.textContent = `Welcome, ${name}! Registration successful.`;
    });

    form.addEventListener("reset", () => {
      success.textContent = "";
      ["fullName", "email", "password", "terms"].forEach((id) => setError(id, ""));
    });
  </script>
</body>
</html>
